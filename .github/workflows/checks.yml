name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Windows PowerShell 5.1 - parse and simulate only
        shell: powershell
        run: ./tests/Test-Offline.ps1
      - name: PowerShell 7 - parse and simulate only
        shell: pwsh
        run: ./tests/Test-Offline.ps1
